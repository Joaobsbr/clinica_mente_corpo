{% load static %}<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Declaração de comparecimento</title><style>body{font:16px Arial,sans-serif;color:#202820;margin:0;background:#f3f5f3}.paper{max-width:800px;margin:40px auto;background:#fff;padding:65px 70px;min-height:650px;box-shadow:0 4px 25px #0001}.brand{text-align:center;border-bottom:1px solid #ddd;padding-bottom:25px}.brand img{width:105px;height:105px;object-fit:contain}.brand h1{font-size:22px;margin:10px 0 4px}.brand p{font-size:12px;color:#667}.doc-title{text-align:center;font-weight:bold;font-size:18px;margin:50px 0}.body{white-space:pre-wrap;line-height:1.9;font-size:16px}.sign{margin-top:100px;text-align:center}.sign div{width:300px;border-top:1px solid #444;margin:0 auto 8px}.actions{text-align:center;margin:20px}.actions button{padding:12px 20px;background:#315b46;color:white;border:0;border-radius:8px;cursor:pointer}@media print{body{background:white}.paper{margin:0;box-shadow:none;max-width:none;padding:30px 50px}.actions{display:none}}</style></head><body><div class="actions"><button onclick="window.print()">Imprimir declaração</button></div><main class="paper"><header class="brand"><img src="{% static 'core/img/logo.png' %}" alt="Logo"><h1>{{ clinic_name }}</h1><p>{{ clinic_address }}</p></header><h2 class="doc-title">DECLARAÇÃO DE COMPARECIMENTO</h2><div class="body">{{ declaration.body_snapshot }}</div><div class="sign"><div></div>Assinatura / identificação da clínica</div></main></body></html>
