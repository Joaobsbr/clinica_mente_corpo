{% extends "core/base.html" %}
{% block title %}{{ title }}{% endblock %}{% block heading %}{{ title }}{% endblock %}
{% block content %}<div class="form-card narrow-card"><h2>{{ title }}</h2><form method="post">{% csrf_token %}{% for field in form %}<div class="field"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<div class="form-actions"><a class="btn ghost" href="{% url back_url %}">Cancelar</a><button class="btn primary">Salvar</button></div></form></div>{% endblock %}
